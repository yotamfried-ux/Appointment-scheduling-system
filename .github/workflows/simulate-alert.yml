name: Simulate Alert (Fail-Safe Verification)
on:
  workflow_dispatch:
    inputs:
      target_scenario:
        description: 'Alert scenario to simulate'
        required: true
        default: 'simulated_downtime'
        type: choice
        options:
          - 'simulated_downtime'
          - 'simulated_stale_cron'

permissions:
  contents: read

jobs:
  simulate_failure:
    name: Simulate Failure & Trigger Alert
    runs-on: ubuntu-latest
    steps:
      - name: Announce Simulation
        run: |
          echo "Simulating failure scenario: ${{ inputs.target_scenario }}"
          echo "This run deliberately fails to prove that GitHub Actions alerts (email/push) fire to repository owners/subscribers upon monitor failure."

      - name: Trigger Simulated Failure
        run: |
          echo "Simulating failed probe to https://turim.d2ryf.com/api/ready (simulated 503 Service Unavailable)..."
          echo "::error title=Monitor Alert Triggered::Simulated monitor failure triggered by operator to verify alerting pipeline."
          echo "### 🔴 Simulated Alert Fired" >> $GITHUB_STEP_SUMMARY
          echo "Scenario: ${{ inputs.target_scenario }}" >> $GITHUB_STEP_SUMMARY
          echo "Result: Workflow marked failed, triggering GitHub notification mechanisms." >> $GITHUB_STEP_SUMMARY
          exit 1
