name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Random canary secret (never committed; must not reach the client bundle)
        run: echo "SUPABASE_SECRET_KEY=sb_secret_$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - run: npm run check:bundle # SEC-04: no secret key in the client bundle (planted-secret negative control + the random canary value)

  e2e:
    name: E2E (Playwright · mobile + desktop · axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (db · auth · rest · mail)
        run: npm run db:start
      - name: Build + run E2E against the real local stack
        run: |
          source scripts/local-env.sh
          npm run build
          npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  database:
    name: DB (migrations · pgTAP · schema lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local Supabase (db only)
        run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime,storage-api,realtime,postgres-meta,supavisor,mailpit,gotrue,postgrest
      - name: pgTAP tests
        run: npx supabase test db
      - name: Schema lint must be clean
        run: |
          out=$(docker exec supabase_db_appointment-scheduling-system psql -U postgres -At -c "select rule||' '||object_name from private.lint_violations()")
          echo "violations: [$out]"
          test -z "$out"
