name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - run: npm run check:bundle # SEC-04: no secret key in the client bundle (with a planted-secret negative control)

  e2e:
    name: E2E (Playwright · mobile + desktop · axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (db · auth · rest · mail)
        run: npm run db:start
      - name: Build + run E2E against the real local stack
        run: |
          source scripts/local-env.sh
          npm run build
          npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  database:
    name: DB (migrations · pgTAP · schema lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local Supabase (db only)
        run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime,storage-api,realtime,postgres-meta,supavisor,mailpit,gotrue,postgrest
      - name: pgTAP tests
        run: npx supabase test db
      - name: Schema lint must be clean
        run: |
          out=$(docker exec supabase_db_appointment-scheduling-system psql -U postgres -At -c "select rule||' '||object_name from private.lint_violations()")
          echo "violations: [$out]"
          test -z "$out"
