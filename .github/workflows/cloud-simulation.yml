name: Cloud simulation (test environment)
# Real-user simulation (Playwright, the engine of the Engineering-OS application-testing tools) against a DEPLOYED instance: a visitor, a customer and,
# when the secrets exist, the owner. Manual. Never run against production data you care about: it books and cancels one appointment and adds then switches off one person.
# Optional repository secrets (entered by the owner in GitHub): CLOUD_OWNER_EMAIL, CLOUD_OWNER_PASSWORD (a TEST account), VERCEL_BYPASS (Vercel "Protection Bypass for Automation").
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Address of the deployment
        required: true
        default: https://appointment-scheduling-sys-git-a8bb97-yotamfried-7101s-projects.vercel.app
      slug:
        description: Slug of the published business to book with
        required: true
        default: demo-barber
permissions:
  contents: read
jobs:
  simulate:
    name: simulate users
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Simulate
        env:
          CLOUD_URL: ${{ inputs.app_url }}
          CLOUD_SLUG: ${{ inputs.slug }}
          CLOUD_OWNER_EMAIL: ${{ secrets.CLOUD_OWNER_EMAIL }}
          CLOUD_OWNER_PASSWORD: ${{ secrets.CLOUD_OWNER_PASSWORD }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
        run: npx playwright test -c playwright.cloud.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-simulation
          path: |
            playwright-report
            test-results
          retention-days: 7
