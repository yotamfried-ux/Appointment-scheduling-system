name: Real Supabase | Availability + Owner Modality
on:
  pull_request:
  push:
    branches: [main, "test/**"]
permissions:
  contents: read
concurrency:
  group: real-avail-modality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-supabase:
    name: Real Supabase · 50 windows + owner modality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local Supabase (DB, Auth, REST, Mail)
        run: npm run db:start
      - name: Test persistence, public slots and actual owner calendar
        run: |
          source scripts/local-env.sh
          npm run build
          npx playwright test tests/e2e/dynamic-availability-modality.spec.ts tests/e2e/owner-modality-real.spec.ts
        env:
          CI: "true"
          E2E_REAL_SUPABASE: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-availability-modality-report
          path: |
            playwright-report
            test-results
          retention-days: 7
