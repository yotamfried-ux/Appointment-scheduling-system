name: Strix security scan
# On demand only (Actions > Strix security scan > Run workflow). Runs the open-source Strix pentest agent against a throw-away LOCAL copy of this app
# (local Supabase in Docker, two seeded businesses), never against production. An LLM is needed:
#   1. repository secrets STRIX_LLM + LLM_API_KEY (the owner's explicit choice of model and key), or, when absent,
#   2. free-tier providers only: secrets GROQ_API_KEY and/or OPENROUTER_API_KEY (same policy as the Engineering-OS runner: never add a paid-capable fallback without the owner's explicit approval).
# With none of them configured the job stops with a clear message instead of failing in the middle of a scan.
on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan depth
        required: true
        default: standard
        type: choice
        options: [quick, standard, deep]
permissions:
  contents: read
env:
  STRIX_TELEMETRY: "0"
concurrency:
  group: strix
  cancel-in-progress: false
jobs:
  scan:
    name: Strix (local copy of the app)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Is a model configured?
        env:
          HAS_STRIX_LLM: ${{ secrets.STRIX_LLM != '' && secrets.LLM_API_KEY != '' }}
          HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          if [ "$HAS_STRIX_LLM" != "true" ] && [ "$HAS_GROQ" != "true" ] && [ "$HAS_OPENROUTER" != "true" ]; then
            echo "No model configured. Add repository secrets STRIX_LLM and LLM_API_KEY (or GROQ_API_KEY / OPENROUTER_API_KEY) and run again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local Supabase (db · auth · rest · mail)
        run: npm run db:start
      - name: Build and start the app on :3100 (production build, no test switches that weaken rate limits)
        run: |
          source scripts/local-env.sh
          npm run build
          export ALLOW_NON_PRODUCTION_DEFAULTS=1 BOOKING_TOKEN_SECRET="$(openssl rand -hex 24)" CRON_SECRET="$(openssl rand -hex 16)" RESEND_WEBHOOK_SECRET="whsec_$(openssl rand -hex 16)" BILLING_PROVIDER=fake EMAIL_PROVIDER=fake PORT=3100
          nohup npx next start -p 3100 > app.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3100/api/health >/dev/null && exit 0; sleep 2; done
          echo "app did not start"; tail -50 app.log; exit 1
      - name: Seed two businesses with separate owners
        run: |
          source scripts/local-env.sh
          node scripts/strix/seed.mjs
      - run: docker info >/dev/null
      - name: Install Strix
        run: |
          python -m pip install --upgrade pip pipx
          pipx install strix-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Strix installation
        run: strix --help >/dev/null
      - name: Run Strix
        id: strix
        continue-on-error: true
        env:
          OWNER_LLM: ${{ secrets.STRIX_LLM }}
          OWNER_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set +e
          PROVIDERS=()
          [[ -n "$OWNER_LLM" && -n "$OWNER_KEY" ]] && PROVIDERS+=("owner|$OWNER_LLM|OWNER_KEY")
          PROVIDERS+=('groq|groq/openai/gpt-oss-120b|GROQ_KEY' 'openrouter|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free|OPENROUTER_KEY' 'openrouter|openrouter/qwen/qwen3.8-27b:free|OPENROUTER_KEY')
          final_code=1; selected=''
          mkdir -p strix-attempt-logs; : > strix-attempts.tsv
          for entry in "${PROVIDERS[@]}"; do
            IFS='|' read -r provider model key_var <<< "$entry"
            key="${!key_var:-}"
            if [[ -z "$key" ]]; then printf '%s\t%s\tskipped_missing_key\n' "$provider" "$model" >> strix-attempts.tsv; continue; fi
            export STRIX_LLM="$model" LLM_API_KEY="$key"
            unset LLM_API_BASE OPENAI_API_BASE LITELLM_BASE_URL
            log="strix-attempt-logs/$(echo "${provider}_${model}" | tr '/:' '__').log"
            echo "Trying $provider / $model" | tee -a "$GITHUB_STEP_SUMMARY"
            strix -n -t ./ -t http://localhost:3100 --instruction-file scripts/strix/instruction.md --scan-mode "${{ inputs.scan_mode }}" --scope-mode full 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            printf '%s\t%s\t%s\n' "$provider" "$model" "$code" >> strix-attempts.tsv
            if [[ "$code" == 0 || "$code" == 2 ]]; then final_code=$code; selected="$provider/$model"; break; fi
            echo "$provider/$model failed (exit $code); trying the next configured model" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "exit_code=$final_code" >> "$GITHUB_OUTPUT"
          echo "Model used: ${selected:-none}; exit=$final_code (0 clean, 2 findings, other = the scan did not run)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$final_code"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strix-evidence-${{ github.run_id }}
          path: |
            strix_runs/
            strix-attempts.tsv
            strix-attempt-logs/
            app.log
          if-no-files-found: warn
          retention-days: 14
      - name: Result
        if: always()
        env:
          CODE: ${{ steps.strix.outputs.exit_code }}
        run: |
          case "$CODE" in
            0) echo "Strix: no findings." ;;
            2) echo "Strix reported findings: download the strix-evidence artifact." >&2; exit 2 ;;
            *) echo "Strix did not complete (exit=${CODE:-missing})." >&2; exit 1 ;;
          esac
