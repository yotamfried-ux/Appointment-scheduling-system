name: Production Uptime & Cron Monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime-monitor
  cancel-in-progress: true

jobs:
  uptime:
    name: Uptime & Cron Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health (Basic Liveness)
        run: |
          echo "Checking https://turim.d2ryf.com/api/health..."
          res=$(curl -f -s -S --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 "https://turim.d2ryf.com/api/health")
          echo "Response: $res"
          echo "$res" | grep -q '"status":"ok"'
          echo "### 🟢 /api/health Liveness: OK" >> $GITHUB_STEP_SUMMARY

      - name: Check /api/ready (Database Connectivity & Readiness)
        run: |
          echo "Checking https://turim.d2ryf.com/api/ready..."
          res=$(curl -f -s -S --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 "https://turim.d2ryf.com/api/ready")
          echo "Response: $res"
          echo "$res" | grep -q '"status":"ready"'
          echo "### 🟢 /api/ready Database Readiness: OK" >> $GITHUB_STEP_SUMMARY

      - name: Check /api/jobs/health (Vercel Cron Health & SLA)
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TOKEN="${MONITOR_SECRET:-$CRON_SECRET}"
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing Secret::Neither MONITOR_SECRET nor CRON_SECRET is configured in GitHub repository secrets. Production monitoring fails closed."
            echo "### 🔴 /api/jobs/health: FAILED (Monitoring secret not configured in repository secrets)" >> $GITHUB_STEP_SUMMARY
            echo "To enable external cron heartbeat monitoring, add MONITOR_SECRET (least privilege) or CRON_SECRET to GitHub Secrets." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Checking https://turim.d2ryf.com/api/jobs/health with least-privilege bearer token..."
          res=$(curl -f -s -S --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 -H "Authorization: Bearer $TOKEN" "https://turim.d2ryf.com/api/jobs/health")
          echo "Response: $res"
          echo "$res" | grep -q '"ok":true'
          echo "### 🟢 /api/jobs/health Cron SLA: OK" >> $GITHUB_STEP_SUMMARY
